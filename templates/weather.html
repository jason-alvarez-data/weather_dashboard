<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            background-color: #f5f5f5;
            padding-top: 2rem;
        }
        .card {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
        }
        .weather-icon {
            font-size: 3rem;
        }
        .temp-large {
            font-size: 2.5rem;
            font-weight: bold;
        }
        .chart-container {
            width: 100%;
            height: 400px;
        }
        #loading {
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row mb-4">
            <div class="col-12">
                <a href="/" class="btn btn-outline-primary">&larr; Back to Search</a>
            </div>
        </div>
        
        <div id="loading">
            <h2>Loading weather data for {{ city }}...</h2>
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        
        <div id="weather-content" style="display: none;">
            <div class="row">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h3>Current Weather</h3>
                        </div>
                        <div class="card-body text-center" id="current-weather">
                            <!-- Current weather data will be inserted here -->
                        </div>
                    </div>
                </div>
                
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h3>Temperature Forecast</h3>
                        </div>
                        <div class="card-body">
                            <div id="temperature-chart" class="chart-container"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h3>Weather Conditions</h3>
                        </div>
                        <div class="card-body">
                            <div id="conditions-chart" class="chart-container"></div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h3>Wind & Precipitation</h3>
                        </div>
                        <div class="card-body">
                            <div id="wind-precip-chart" class="chart-container"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h3>5-Day Forecast</h3>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>Date & Time</th>
                                            <th>Temperature</th>
                                            <th>Weather</th>
                                            <th>Wind</th>
                                            <th>Precipitation</th>
                                        </tr>
                                    </thead>
                                    <tbody id="forecast-table">
                                        <!-- Forecast data will be inserted here -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="row mt-4" id="history-section" style="display: none;">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h3>Historical Data</h3>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-sm table-hover">
                                    <thead>
                                        <tr>
                                            <th>Timestamp</th>
                                            <th>Temperature</th>
                                            <th>Weather</th>
                                            <th>Humidity</th>
                                            <th>Wind</th>
                                        </tr>
                                    </thead>
                                    <tbody id="history-table">
                                        <!-- Historical data will be inserted here -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get the city from the template
        const city = "{{ city }}";
        
        // Fetch weather data from the API
        fetch(`/api/weather?city=${encodeURIComponent(city)}`)
            .then(response => response.json())
            .then(data => {
                // Hide loading indicator and show content
                document.getElementById('loading').style.display = 'none';
                document.getElementById('weather-content').style.display = 'block';
                
                // Display current weather
                displayCurrentWeather(data.current);
                
                // Display forecast table
                displayForecastTable(data.forecast);
                
                // Display historical data if available
                if (data.history && data.history.data && data.history.data.length > 1) {
                    displayHistoricalData(data.history);
                }
                
                // Create charts
                createTemperatureChart(data.forecast);
                createWeatherConditionsChart(data.forecast);
                createWindPrecipChart(data.forecast);
            })
            .catch(error => {
                console.error('Error fetching weather data:', error);
                document.getElementById('loading').innerHTML = `
                    <div class="alert alert-danger">
                        <h4>Error loading weather data</h4>
                        <p>Please try again later or go back to search for a different city.</p>
                    </div>
                `;
            });
        
        function displayCurrentWeather(current) {
            let weatherIcon = '🌡️';
            if (current.weather_main.includes('Clear')) weatherIcon = '☀️';
            else if (current.weather_main.includes('Cloud')) weatherIcon = '☁️';
            else if (current.weather_main.includes('Rain')) weatherIcon = '🌧️';
            else if (current.weather_main.includes('Snow')) weatherIcon = '❄️';
            else if (current.weather_main.includes('Thunder')) weatherIcon = '⛈️';
            else if (current.weather_main.includes('Mist') || current.weather_main.includes('Fog')) weatherIcon = '🌫️';
            
            document.getElementById('current-weather').innerHTML = `
                <h2>${current.city}, ${current.country}</h2>
                <div class="weather-icon">${weatherIcon}</div>
                <div class="temp-large">${current.temperature}°C</div>
                <p>Feels like: ${current.feels_like}°C</p>
                <p>${current.weather_description.charAt(0).toUpperCase() + current.weather_description.slice(1)}</p>
                
                <hr>
                
                <div class="row">
                    <div class="col-6 text-start">
                        <p>Humidity: ${current.humidity}%</p>
                        <p>Pressure: ${current.pressure} hPa</p>
                    </div>
                    <div class="col-6 text-start">
                        <p>Wind: ${current.wind_speed} m/s</p>
                        <p>Clouds: ${current.clouds}%</p>
                    </div>
                </div>
                
                <p class="text-muted mt-2">Last updated: ${current.timestamp}</p>
            `;
        }
        
        function displayForecastTable(forecast) {
            const tableBody = document.getElementById('forecast-table');
            let html = '';
            
            forecast.forecast.forEach(item => {
                html += `
                    <tr>
                        <td>${item.datetime}</td>
                        <td>${item.temperature}°C</td>
                        <td>${item.weather_description.charAt(0).toUpperCase() + item.weather_description.slice(1)}</td>
                        <td>${item.wind_speed} m/s</td>
                        <td>${item.probability}%</td>
                    </tr>
                `;
            });
            
            tableBody.innerHTML = html;
        }
        
        function displayHistoricalData(history) {
            if (history.data.length <= 1) return;
            
            document.getElementById('history-section').style.display = 'block';
            const tableBody = document.getElementById('history-table');
            let html = '';
            
            history.data.forEach(item => {
                html += `
                    <tr>
                        <td>${item.timestamp}</td>
                        <td>${item.temperature}°C</td>
                        <td>${item.weather_description.charAt(0).toUpperCase() + item.weather_description.slice(1)}</td>
                        <td>${item.humidity}%</td>
                        <td>${item.wind_speed} m/s</td>
                    </tr>
                `;
            });
            
            tableBody.innerHTML = html;
        }
        
        function createTemperatureChart(forecast) {
            const dates = forecast.forecast.map(item => item.datetime);
            const temperatures = forecast.forecast.map(item => item.temperature);
            
            const trace = {
                x: dates,
                y: temperatures,
                type: 'scatter',
                mode: 'lines+markers',
                name: 'Temperature (°C)',
                line: {
                    color: 'red',
                    width: 2
                }
            };
            
            const layout = {
                title: `Temperature Forecast for ${forecast.city}`,
                xaxis: {
                    title: 'Date & Time'
                },
                yaxis: {
                    title: 'Temperature (°C)'
                },
                margin: { t: 50, l: 50, r: 30, b: 80 }
            };
            
            Plotly.newPlot('temperature-chart', [trace], layout);
        }
        
        function createWeatherConditionsChart(forecast) {
            // Count occurrences of each weather condition
            const conditions = {};
            forecast.forecast.forEach(item => {
                const condition = item.weather_main;
                conditions[condition] = (conditions[condition] || 0) + 1;
            });
            
            const labels = Object.keys(conditions);
            const values = Object.values(conditions);
            
            const trace = {
                labels: labels,
                values: values,
                type: 'pie',
                textinfo: 'label+percent',
                insidetextorientation: 'radial'
            };
            
            const layout = {
                title: 'Weather Conditions Distribution',
                margin: { t: 50, l: 30, r: 30, b: 30 }
            };
            
            Plotly.newPlot('conditions-chart', [trace], layout);
        }
        
        function createWindPrecipChart(forecast) {
            const dates = forecast.forecast.map(item => item.datetime);
            const windSpeeds = forecast.forecast.map(item => item.wind_speed);
            const precipProbs = forecast.forecast.map(item => item.probability);
            
            const windTrace = {
                x: dates,
                y: windSpeeds,
                type: 'bar',
                name: 'Wind Speed (m/s)',
                marker: {
                    color: 'blue'
                }
            };
            
            const precipTrace = {
                x: dates,
                y: precipProbs,
                type: 'scatter',
                mode: 'lines+markers',
                name: 'Precipitation Probability (%)',
                yaxis: 'y2',
                line: {
                    color: 'green',
                    width: 2
                }
            };
            
            const layout = {
                title: 'Wind Speed & Precipitation Probability',
                xaxis: {
                    title: 'Date & Time'
                },
                yaxis: {
                    title: 'Wind Speed (m/s)',
                    side: 'left'
                },
                yaxis2: {
                    title: 'Precipitation Probability (%)',
                    overlaying: 'y',
                    side: 'right'
                },
                legend: {
                    x: 0,
                    y: 1.2
                },
                margin: { t: 50, l: 50, r: 50, b: 80 }
            };
            
            Plotly.newPlot('wind-precip-chart', [windTrace, precipTrace], layout);
        }
    </script>
</body>
</html>
